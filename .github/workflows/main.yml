name: CI/CD Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOTNET_ROOT: /Users/runner/.dotnet

jobs:
  build-test-release:
    runs-on: macos-latest
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Run Build Dependencies
      run: brew install ffmpeg mpv

    - name: Run .NET Tests
      run: dotnet test LibSEBridge.Tests/LibSEBridge.Tests.csproj --configuration Release

    - name: Build .NET Bridge (Native AOT)
      run: |
        dotnet publish -c Release -r osx-arm64 --self-contained true /p:PublishAot=true /p:NativeLib=Shared -o bin/Native LibSEBridge/LibSEBridge.csproj
        mkdir -p .build/debug
        mkdir -p .build/release
        cp bin/Native/*.dylib .build/debug/
        cp bin/Native/*.dylib .build/release/
        # Also copy to current dir for some local runners
        cp bin/Native/*.dylib .

    - name: Run Swift Tests (SPM)
      run: swift test

    - name: Run Logic Stress Tests
      run: swift run TestRunner

    - name: Run Packaging Script
      run: |
        chmod +x package.sh
        ./package.sh
    
    - name: Upload DMG Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SubtitleEditNative-DMG-arm64
        path: SubtitleEditNative_v*_macOS_arm64.dmg

    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: SubtitleEditNative_v*_macOS_arm64.dmg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

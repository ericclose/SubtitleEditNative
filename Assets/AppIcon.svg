<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed background -->
  <rect width="512" height="512" fill="url(#full_bg_grad)" />
  
  <!-- Stylized Film Strip on the left -->
  <rect x="0" y="0" width="160" height="512" fill="white" fill-opacity="0.08" />
  <g id="film_holes_bleed">
    <rect x="40" y="40" width="80" height="60" rx="12" fill="black" fill-opacity="0.2" />
    <rect x="40" y="140" width="80" height="60" rx="12" fill="black" fill-opacity="0.2" />
    <rect x="40" y="240" width="80" height="60" rx="12" fill="black" fill-opacity="0.2" />
    <rect x="40" y="340" width="80" height="60" rx="12" fill="black" fill-opacity="0.2" />
    <rect x="40" y="440" width="80" height="60" rx="12" fill="black" fill-opacity="0.2" />
  </g>
  
  <!-- Prominent SE Block with MD3 elevation -->
  <rect x="180" y="100" width="312" height="312" rx="48" fill="white" />
  <text x="215" y="320" font-family="sans-serif" font-weight="900" font-size="160" fill="#0061A4">SE</text>
  
  <defs>
    <linearGradient id="full_bg_grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#007ACC" />
      <stop offset="1" stop-color="#005A99" />
    </linearGradient>
  </defs>
</svg>
